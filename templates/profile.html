{% extends 'base.html' %}{% block content %}<form class="form card" method="post"><h1>Profile & preferences</h1><label>Name<input name="name" value="{{user['name']}}"></label><label>Goal<select name="goal">{% for v,l in [('stay_active','Stay active'),('weight_loss','Weight loss'),('strength','Build strength'),('flexibility','Improve flexibility')] %}<option value="{{v}}" {% if user['goal']==v %}selected{% endif %}>{{l}}</option>{% endfor %}</select></label><label>Level<select name="level">{% for v in ['beginner','intermediate','advanced'] %}<option value="{{v}}" {% if user['level']==v %}selected{% endif %}>{{v|capitalize}}</option>{% endfor %}</select></label><label>Default time<select name="available_time">{% for v in [5,10,20,30] %}<option value="{{v}}" {% if user['available_time']==v %}selected{% endif %}>{{v}} minutes</option>{% endfor %}</select></label><label>Equipment<input name="equipment" value="{{user['equipment']}}"></label><div class="two"><label>Reminder starts<input type="time" name="reminder_start" value="{{user['reminder_start']}}"></label><label>Reminder ends<input type="time" name="reminder_end" value="{{user['reminder_end']}}"></label></div><button class="btn">Save preferences</button></form>{% endblock %}
