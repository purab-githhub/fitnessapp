{% extends 'base.html' %}{% block content %}<form class="form card" method="post"><h2>Let's personalize your plan</h2><label>Fitness goal<select name="goal"><option value="stay_active">Stay active</option><option value="weight_loss">Weight loss</option><option value="strength">Build strength</option><option value="flexibility">Improve flexibility</option></select></label><label>Fitness level<select name="level"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label><label>Typical workout time<select name="available_time"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="20" selected>20 minutes</option><option value="30">30 minutes</option></select></label><label>Equipment<select name="equipment"><option value="none">No equipment</option><option value="dumbbells">Dumbbells</option><option value="bands">Resistance bands</option></select></label><div class="two"><label>Reminder starts<input type="time" name="reminder_start" value="18:00"></label><label>Reminder ends<input type="time" name="reminder_end" value="21:00"></label></div><button class="btn">Create my plan</button></form>{% endblock %}
