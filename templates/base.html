<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitSync</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header><a class="brand" href="{{ url_for('dashboard') }}">FitSync</a>{% if user %}<nav><a href="{{ url_for('dashboard') }}">Home</a><a href="{{ url_for('progress') }}">Progress</a><a href="{{ url_for('buddy') }}">Buddy</a><a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('logout') }}">Logout</a></nav>{% endif %}</header><main class="container">{% with msgs=get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static',filename='js/app.js') }}"></script></body></html>
